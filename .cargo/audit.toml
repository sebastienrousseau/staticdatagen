# cargo-audit configuration
# Ignores for transitive advisories that cannot be fixed locally. Each one
# must match a crate in Cargo.lock; an entry nothing matches is removed.
#
# Last reviewed: 2026-10-09
# Next review:   2027-01-09

[advisories]
ignore = [
    # Unmaintained; transitive via html-generator -> mdx-gen -> syntect.
    "RUSTSEC-2025-0141",  # bincode - unmaintained

    # Deep transitive via jiff -> defmt -> defmt-macros -> proc-macro-error2
    # (unmaintained 2026-06-07). Proc-macro helper crate, not reachable from
    # any runtime path of staticdatagen. Re-evaluate when defmt-macros
    # migrates to `manyhow` or `proc-macro2-diagnostics` (the upstream's
    # recommended replacements per RUSTSEC-2026-0173).
    "RUSTSEC-2026-0173",  # proc-macro-error2 - unmaintained
]
