name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  # ── Gate: full CI must pass before release ────────────────────────
  ci:
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@main
    with:
      rust-version: 'stable'
      run-coverage: false
      run-cross-platform: true

  # ── Release: cross-compile, publish, SBOM ─────────────────────────
  # `rust-targets` MUST be a JSON-encoded array of `{target, os}`
  # objects — the reusable workflow's matrix accesses
  # `matrix.platform.target` and `matrix.platform.os`. Passing a bare
  # string array silently produces a matrix that expands to zero
  # valid jobs, so `build-rust` is skipped, `release-rust` (which
  # `needs: build-rust`) is skipped, and no GitHub Release is
  # published — this is exactly what happened on the v0.0.10 tag
  # (manually published with `gh release create v0.0.10`).
  release:
    needs: ci
    uses: sebastienrousseau/pipelines/.github/workflows/release.yml@main
    with:
      language: rust
      # aarch64-unknown-linux-gnu and x86_64-unknown-linux-musl are back.
      #
      # Both were dropped because `onig_sys` runs a cc-rs build script that
      # needs a cross linker ubuntu-latest does not carry, and the fail-fast
      # matrix let one missing linker cancel every other build and skip
      # `Release Rust` with them. aarch64 went in #118; dropping it revealed
      # musl behind it, dropped in #122.
      #
      # sebastienrousseau/pipelines#9 now installs gcc-aarch64-linux-gnu and
      # musl-tools and sets CARGO_TARGET_*_LINKER, so the builds can link.
      # This repository tracks that workflow at @main, so the fix is live.
      #
      # The value below must be PURE JSON. The reusable workflow calls
      # fromJSON on it, and JSON has no comments — a `#` inside the block
      # scalar is data, not a comment, and makes the parse fail (#119).
      rust-targets: |
        [
          {"target":"x86_64-unknown-linux-gnu",  "os":"ubuntu-latest"},
          {"target":"aarch64-unknown-linux-gnu", "os":"ubuntu-latest"},
          {"target":"x86_64-unknown-linux-musl", "os":"ubuntu-latest"},
          {"target":"x86_64-apple-darwin",       "os":"macos-latest"},
          {"target":"aarch64-apple-darwin",      "os":"macos-latest"},
          {"target":"x86_64-pc-windows-msvc",    "os":"windows-latest"}
        ]
    secrets:
      # This repository's token is named CARGO_API_TOKEN. The workflow input
      # is called CRATES_TOKEN, and `secrets.CRATES_TOKEN` — which has never
      # existed here — silently resolved to an empty string, so every publish
      # attempt died with "please provide a non-empty token".
      #
      # Invisible for six releases, because `Release Rust` never ran: the
      # matrix was empty through v0.0.13, cross linkers were missing on
      # v0.0.14, and the checkout was dirty on v0.0.15. v0.0.16 is the first
      # tag to reach the publish step at all.
      CRATES_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
