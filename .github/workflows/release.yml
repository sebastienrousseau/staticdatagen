name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  # ── Gate: full CI must pass before release ────────────────────────
  ci:
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@main
    with:
      rust-version: 'stable'
      run-coverage: false
      run-cross-platform: true

  # ── Release: cross-compile, publish, SBOM ─────────────────────────
  # `rust-targets` MUST be a JSON-encoded array of `{target, os}`
  # objects — the reusable workflow's matrix accesses
  # `matrix.platform.target` and `matrix.platform.os`. Passing a bare
  # string array silently produces a matrix that expands to zero
  # valid jobs, so `build-rust` is skipped, `release-rust` (which
  # `needs: build-rust`) is skipped, and no GitHub Release is
  # published — this is exactly what happened on the v0.0.10 tag
  # (manually published with `gh release create v0.0.10`).
  release:
    needs: ci
    uses: sebastienrousseau/pipelines/.github/workflows/release.yml@main
    with:
      language: rust
      # aarch64-unknown-linux-gnu is omitted deliberately. `onig_sys` runs a
      # cc-rs build script that needs `aarch64-linux-gnu-gcc`, which
      # ubuntu-latest does not carry, so the target failed on every tag from
      # v0.0.9 on. The matrix fails fast, so it cancelled the other five
      # builds and skipped `Release Rust` with them — which is why every
      # release to date was published by hand, 0.0.13 included.
      #
      # Dropping it costs nothing that works today: it has never once
      # produced a binary. It can return once the cross toolchain is
      # installed in sebastienrousseau/pipelines.
      #
      # The value below must be PURE JSON. The reusable workflow calls
      # fromJSON on it, and JSON has no comments — a `#` inside this block
      # scalar is data, not a comment, and makes the parse fail. That is why
      # this explanation lives out here as YAML rather than in there.
      rust-targets: |
        [
          {"target":"x86_64-unknown-linux-gnu",  "os":"ubuntu-latest"},
          {"target":"x86_64-unknown-linux-musl", "os":"ubuntu-latest"},
          {"target":"x86_64-apple-darwin",       "os":"macos-latest"},
          {"target":"aarch64-apple-darwin",      "os":"macos-latest"},
          {"target":"x86_64-pc-windows-msvc",    "os":"windows-latest"}
        ]
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
