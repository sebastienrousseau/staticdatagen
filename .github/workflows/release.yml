name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  # ── Gate: full CI must pass before release ────────────────────────
  ci:
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@main
    with:
      rust-version: 'stable'
      run-coverage: false
      run-cross-platform: true

  # ── Release: cross-compile, publish, SBOM ─────────────────────────
  # `rust-targets` MUST be a JSON-encoded array of `{target, os}`
  # objects — the reusable workflow's matrix accesses
  # `matrix.platform.target` and `matrix.platform.os`. Passing a bare
  # string array silently produces a matrix that expands to zero
  # valid jobs, so `build-rust` is skipped, `release-rust` (which
  # `needs: build-rust`) is skipped, and no GitHub Release is
  # published — this is exactly what happened on the v0.0.10 tag
  # (manually published with `gh release create v0.0.10`).
  release:
    needs: ci
    uses: sebastienrousseau/pipelines/.github/workflows/release.yml@main
    with:
      language: rust
      rust-targets: |
        [
          {"target":"x86_64-unknown-linux-gnu",  "os":"ubuntu-latest"},
          # aarch64-unknown-linux-gnu is omitted deliberately. `onig_sys`
          # runs a cc-rs build script that needs `aarch64-linux-gnu-gcc`,
          # which ubuntu-latest does not carry, so this target has failed
          # on every tag since v0.0.9 — and because the matrix fails fast,
          # it cancelled the other five builds and skipped `Release Rust`
          # with them. That is why v0.0.10 had to be published by hand and
          # why 0.0.13 never reached crates.io at all.
          #
          # Dropping it costs nothing that currently works: the target has
          # never once produced a binary. Restoring it needs the cross
          # toolchain installed in sebastienrousseau/pipelines, at which
          # point it can come back.
          {"target":"x86_64-unknown-linux-musl", "os":"ubuntu-latest"},
          {"target":"x86_64-apple-darwin",       "os":"macos-latest"},
          {"target":"aarch64-apple-darwin",      "os":"macos-latest"},
          {"target":"x86_64-pc-windows-msvc",    "os":"windows-latest"}
        ]
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
