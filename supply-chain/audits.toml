[[audits.fearless_simd]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "1.1.0"
notes = "Read all hand-written source (lib.rs, transmute.rs, macros.rs, kernel_macros.rs, support.rs, math.rs, generated.rs; traits.rs scanned for unsafe) and every unsafe site in src/generated (one vectorize helper per x86 backend, 20 NEON vld4q/vst4q calls on fixed-size array refs); spot-checked about 10 generated functions per backend. Tokens are ZSTs with private fields, made only through cpuid-backed Level::new, the cfg-gated baseline, or #[target_feature] assume_supported; the AVX-512 feature list matches in all five places. Intrinsics run in kernel! inner functions whose target features match the token. Transmutes go through SimdPod with const size and alignment checks. No build.rs, no I/O."

[[audits.fearless_simd_macros]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.1.0"
notes = "Read all of src/lib.rs. The #[simd] proc macro moves a function body into a closure passed to fearless_simd::__fearless_simd_dispatch!, taking the token through ExtractToken on the first typed parameter. It emits no unsafe itself; the only unsafe is in fearless_simd dispatch_entry, keyed to the genuine token level, and the user body stays outside any unsafe block. Rejects async, const, variadic, naked and track_caller functions. No file, network, process or env access at expansion; include_str of its own README is docs only."

