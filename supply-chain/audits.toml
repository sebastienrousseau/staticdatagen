[[audits.borsh]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-run"
version = "1.8.1"
notes = "Binary serialization (dev-only, via bit-vec under proptest). unsafe is confined to de/mod.rs array deserialization (MaybeUninit buffer with a drop guard counting initialised elements; sound) and two const NonZeroUsize::new_unchecked on non-zero literals. build.rs only sets cfg aliases. The generate_schema_schema binary writes schema_schema.dat in the working directory and is not built as a dependency. No network, process or environment access."

