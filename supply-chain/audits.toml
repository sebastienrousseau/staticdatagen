[[audits.phf]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.13.1 -> 0.14.0"
notes = "No unsafe, no I/O. Lookups use the new PhfEq trait instead of PhfBorrow; entries are still bounds-checked. Adds an optional ptrhash layout (off by default) and cfg-resolving macro_rules helpers for phf_macros. MSRV 1.85, edition 2024."

[[audits.phf_codegen]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.13.1 -> 0.14.0"
notes = "No unsafe. No file, env or process I/O of its own: it formats generated Rust through Display and the calling build script writes the file. Default CHD output unchanged. Optional quote ToTokens support and ptrhash output, both off by default."

[[audits.phf_generator]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.13.1 -> 0.14.0"
notes = "No unsafe, no I/O. CHD generator refactored to a flat bucket buffer with deterministic tie-breaking and a usize::MAX empty-slot sentinel; lambda lowered from 5 to 3. Optional ptrhash generator (off by default) retries seeds from a fixed-seed RNG. Build-time only."

[[audits.phf_shared]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.13.1 -> 0.14.0"
notes = "One new unsafe: casting u8, i8 and bool slices to a byte slice for hashing, sound since these are size 1, align 1 and every value is a valid byte. Hashing is portable across endianness and pointer width and slices are length-prefixed, so hashes differ from 0.13 but are deterministic. Optional ptrhash module is plain arithmetic. No I/O."

[[audits.proc-macro-crate]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-run"
delta = "1.2.1 -> 3.5.0"
notes = "Resolves a dependency name from Cargo.toml for proc macros: reads CARGO_MANIFEST_DIR and CARGO_TARGET_TMPDIR, stats and parses Cargo.toml with toml_edit, and runs the CARGO binary with locate-project to find the workspace manifest. That is the crate's documented purpose; no unsafe, network access or writes."

