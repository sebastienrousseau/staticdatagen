[[audits.memchr-n]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
version = "0.1.9"
notes = "Read all non-test source (lib.rs, search.rs, bitset.rs, swar, vector). Unsafe: get_unchecked(scan_offset..) relying on scan_offset <= len, kept by advance_to clamping and the scan contracts; a private union KernelStorage read only through function-pointer tables built from the same kernel type; assert_unchecked hints on returned indices and counts, checked by hand for every tail path; a ZST fearless_simd token rebuilt with transmute_copy (const-asserted size 0, align 1) inside function pointers reachable only after scan_ops received a real token. Relies on fearless_simd masks being 0 or -1 and on to_bitmask width, both checked per backend. No build.rs, no I/O."

