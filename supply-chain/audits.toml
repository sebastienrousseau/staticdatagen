[[audits.chacha20]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-run"
delta = "0.10.0 -> 0.10.2"
notes = "SSE2 backend drops an SSE4.1 intrinsic and uses unaligned 16-byte loads and a store within the 64-byte state, in bounds; the NEON cipher backend moves to 8-block batches, with array sizes, counter offsets and 64-byte block writes checked in bounds. RNG paths unchanged in size. Adds a ChaCha20LegacyCore export. No build script, no I/O, network, process or env access."

[[audits.comrak]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.54.0 -> 0.55.0"
notes = "Delta 0.54.0 -> 0.55.0 (9 files, +194/-110): autolink parser fixes for GHSA-xg9p-p4jc-c46g (stack overflow and quadratic time) in src/parser/autolink.rs; tagfilter deprecated in options.rs/html.rs; CLI deprecation warning; tests. No new unsafe, build.rs unchanged, no dependency changes."

[[audits.comrak]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.55.0 -> 0.56.0"
notes = "Full source diff read. No unsafe added or changed; build.rs unchanged; no new fs, network, process or env access in library code. Fixes several DoS cases (table autocomplete cap, emphasis mod-three, relaxed autolink rescans, footnotes, header ids, recursive collect_text). The tagfilter extension is removed (a compile error if used). HTML and href escaping are rewritten on memchr-n with the same byte sets and outputs, so their correctness rests on memchr-n match iteration, audited separately. Default HTML output unchanged except fences indented with tabs."

[[audits.cpufeatures]]
who = "Sebastien Rousseau <sebastienrousseau@users.noreply.github.com>"
criteria = "safe-to-run"
delta = "0.2.17 -> 0.3.1"
notes = "Unsafe is limited to CPUID, xgetbv behind the OSXSAVE check, cpucfg asm on loongarch64 (pure, nomem), getauxval(AT_HWCAP) and a read-only sysctlbyname with a NUL-terminated name and 4-byte output. AVX detection now requires OS YMM support; adds sha512, sm3 and sm4. No build script, no env or file I/O."

